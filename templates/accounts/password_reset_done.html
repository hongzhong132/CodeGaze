<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件已发送 - CodeGaze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5fafe 0%, #eaf6fa 50%, #f0f8fb 100%);
        }
        .box {
            width: 100%;
            max-width: 560px;
            background: rgba(255,255,255,.92);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 45px rgba(66,153,225,.10);
            text-align: center;
        }
        h2 { font-weight: 800; color: #0f172a; margin-bottom: 14px; }
        p { color: #64748b; line-height: 1.9; margin-bottom: 0; }
        a { color: #0891b2; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="box">
        <h2>重置邮件已提交</h2>
        <p>
            如果该邮箱对应系统中的有效账号，你会收到一封密码重置邮件。<br>
            请检查收件箱和垃圾邮件箱，然后点击邮件中的链接继续操作。
        </p>
        <p style="margin-top:16px;">
            <a href="{% url 'accounts:login' %}">返回登录</a>
        </p>
    </div>
</body>
</html>
