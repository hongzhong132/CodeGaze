<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码重置成功 - CodeGaze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f5fafe 0%, #eaf6fa 50%, #f0f8fb 100%);
        }
        .box {
            width: 100%;
            max-width: 560px;
            background: rgba(255,255,255,.92);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 45px rgba(66,153,225,.10);
            text-align: center;
        }
        h2 { font-weight: 800; color: #0f172a; margin-bottom: 14px; }
        p { color: #64748b; line-height: 1.9; margin-bottom: 0; }
        a {
            display: inline-block;
            margin-top: 18px;
            color: #0891b2;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>密码已重置成功</h2>
        <p>你的密码已经修改完成，现在可以返回登录页，使用新密码登录 CodeGaze。</p>
        <a href="{% url 'accounts:login' %}">返回登录</a>
    </div>
</body>
</html>
