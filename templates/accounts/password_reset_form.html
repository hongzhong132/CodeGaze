<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - CodeGaze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(6, 182, 212, 0.12), transparent 28%),
                radial-gradient(circle at bottom right, rgba(2, 132, 199, 0.10), transparent 30%),
                linear-gradient(135deg, #f5fafe 0%, #eaf6fa 50%, #f0f8fb 100%);
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card-shell {
            width: 100%;
            max-width: 560px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(8, 145, 178, 0.10);
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 45px rgba(66, 153, 225, 0.10);
            padding: 34px 30px 28px;
        }
        .badge-top {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(8, 145, 178, 0.08);
            color: #0f766e;
            font-size: 0.83rem;
            font-weight: 700;
            border: 1px solid rgba(8, 145, 178, 0.10);
            margin-bottom: 18px;
        }
        .title { margin: 0; font-size: 2rem; font-weight: 800; color: #0f172a; }
        .subtitle { margin: 12px 0 0; color: #64748b; font-size: 0.95rem; line-height: 1.8; }
        .form-group { margin-top: 20px; }
        .form-label { display:block; margin-bottom:8px; color:#334155; font-weight:700; }
        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #94a3b8;
        }
        .form-input {
            width: 100%; height: 54px; border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(248, 252, 255, 0.96);
            padding: 0 16px 0 46px;
            font-size: 0.95rem;
            outline: none;
        }
        .form-input:focus {
            background: #fff;
            border-color: rgba(8, 145, 178, 0.28);
            box-shadow: 0 0 0 4px rgba(8, 145, 178, 0.08);
        }
        .inline-error { margin-top: 6px; color: #dc2626; font-size: 0.82rem; }
        .submit-btn {
            width: 100%; height: 56px; border: none; border-radius: 16px;
            font-size: 1rem; font-weight: 800; color: #fff;
            background: linear-gradient(90deg, #0891b2, #0284c7);
            box-shadow: 0 10px 22px rgba(8, 145, 178, 0.20);
            margin-top: 22px;
        }
        .footer-links {
            margin-top: 18px;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
        .footer-links a {
            color: #0891b2;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card-shell">
        <div class="badge-top">
            <i class="bi bi-envelope-lock"></i>
            <span>邮箱找回密码</span>
        </div>

        <h2 class="title">忘记密码</h2>
        <p class="subtitle">
            请输入你注册时填写的邮箱。若该邮箱对应有效账号，系统会向该邮箱发送一封包含重置链接的邮件。
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_email">邮箱</label>
                <div class="input-wrap">
                    <span class="input-icon"><i class="bi bi-envelope"></i></span>
                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        class="form-input"
                        placeholder="请输入注册邮箱"
                        value="{{ form.email.value|default:'' }}"
                        autocomplete="email"
                        required
                    >
                </div>
                {% if form.email.errors %}
                    <div class="inline-error">{{ form.email.errors }}</div>
                {% endif %}
            </div>

            <button type="submit" class="submit-btn">
                <i class="bi bi-send me-2"></i>
                发送重置邮件
            </button>
        </form>

        <div class="footer-links">
            想起密码了？
            <a href="{% url 'accounts:login' %}">返回登录</a>
        </div>
    </div>
</body>
</html>
